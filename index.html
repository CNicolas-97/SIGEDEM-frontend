<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO: valores por defecto. Cada página los reemplaza con <Seo>
         (título, descripción, canonical y og:url propios). -->
    <title>SIGEDEM — Dirección de Deportes de Tucumán</title>
    <meta
      name="description"
      content="Consultá las disciplinas deportivas municipales de Tucumán, sus sedes y horarios, e inscribite online con SIGEDEM, el sistema de la Dirección de Deportes."
    />
    <meta name="author" content="Dirección de Deportes de Tucumán" />
    <meta name="theme-color" content="#0b6ea8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Tipografías: Archivo Black (títulos) y Public Sans (texto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Public+Sans:wght@400;500;600&display=swap"
    />

    <!-- Open Graph: vista previa al compartir en redes -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="SIGEDEM" />
    <meta
      property="og:title"
      content="SIGEDEM — Dirección de Deportes de Tucumán"
    />
    <meta
      property="og:description"
      content="Disciplinas deportivas municipales de Tucumán: sedes, horarios e inscripción online."
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="SIGEDEM — Dirección de Deportes de Tucumán"
    />
    <meta
      name="twitter:description"
      content="Disciplinas deportivas municipales de Tucumán: sedes, horarios e inscripción online."
    />

    <!-- Datos estructurados: identifica al sitio como organismo público -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "GovernmentOrganization",
        "name": "Dirección de Deportes de Tucumán",
        "alternateName": "SIGEDEM",
        "url": "https://sigedem-frontend.vercel.app/",
        "description": "Sistema Integral de Gestión Deportiva Municipal para la inscripción y gestión de disciplinas deportivas.",
        "areaServed": {
          "@type": "AdministrativeArea",
          "name": "Tucumán, Argentina"
        }
      }
    </script>
  </head>
  <body>
    <noscript>SIGEDEM necesita JavaScript habilitado para funcionar.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
